name: Native Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Windows release tag to build and publish"
        required: true
        default: "v8.6.10"
  push:
    tags:
      - "v*.*.*"
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build and smoke native Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest aiohttp cryptography watchdog

      - name: Verify release identity and isolated Windows surface
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:TAG_NAME -ne "v$version") { throw "tag/version mismatch: $env:TAG_NAME vs $version" }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) { throw "package/VERSION mismatch" }
          if (Test-Path scripts/build_windows_release.py) { throw "Windows builder leaked into shared scripts/" }
          if (Select-String -Path install.sh -Pattern "Herdr" -Quiet) { throw "Windows Herdr logic leaked into install.sh" }
          if (-not (Test-Path platforms/windows/packaging/build_release.py)) { throw "isolated Windows builder missing" }
          if (-not (Test-Path lib/platforms/windows/herdr/backend.py)) { throw "isolated Herdr backend missing" }

      - name: Run Windows release tests
        shell: pwsh
        run: |
          python -m pytest -q `
            test/test_build_windows_release_script.py `
            test/test_install_windows_rmux_contract.py `
            test/test_windows_x64_release_surface.py `
            test/test_windows_x64_release_surface_baseline_version.py `
            test/test_windows_x64_release_surface_dependency_admission.py `
            test/test_ccbd_windows_tcp_loopback_import_guard.py `
            test/test_ccbd_windows_tcp_loopback_transport.py `
            test/test_herdr_backend_client.py `
            test/test_herdr_bootstrap.py `
            test/test_herdr_config_import.py `
            test/test_herdr_surface_projection.py
          cargo test --locked --manifest-path platforms/windows/launcher/Cargo.toml

      - name: Build isolated Windows artifact
        shell: pwsh
        run: |
          python platforms/windows/packaging/build_release.py `
            --output-dir dist/windows/x86_64 `
            --git-ref HEAD

      - name: Install and smoke from release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Resolve-Path dist/windows/x86_64/ccb-windows-x86_64.zip
          $checksumLine = (Get-Content dist/windows/x86_64/ccb-windows-x86_64.zip.sha256 -Raw).Trim()
          $digest = ($checksumLine -split '\s+')[0]
          $prefix = Join-Path $env:RUNNER_TEMP "ccb-windows-release-install"
          $env:HOME = Join-Path $env:RUNNER_TEMP "ccb-windows-release-home"
          $env:USERPROFILE = $env:HOME
          $env:CODEX_HOME = Join-Path $env:HOME ".codex"
          $env:FACTORY_HOME = Join-Path $env:HOME ".factory"
          $env:CCB_INSTALL_ASSUME_YES = "1"
          .\install.ps1 install -InstallPrefix $prefix -SourceArchive $archive -ExpectedSha256 $digest -Yes
          & (Join-Path $prefix "bin\ccb.exe") --print-version
          & (Join-Path $prefix "bin\ccb.exe") --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "installed ccb.exe smoke failed" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccb-windows-x86_64
          path: |
            dist/windows/x86_64/ccb-windows-x86_64.zip
            dist/windows/x86_64/ccb-windows-x86_64.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Publish Windows GitHub release
    runs-on: ubuntu-latest
    needs: build-windows-x64

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ccb-windows-x86_64
          path: dist/windows/x86_64

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${TAG_NAME}.md"
          test -s "$notes"
          grep -Fx '## English' "$notes"
          grep -Fx '## 中文' "$notes"
          (cd dist/windows/x86_64 && sha256sum -c ccb-windows-x86_64.zip.sha256)
          title="$TAG_NAME"
          release_flags=(--latest)
          if [[ "$TAG_NAME" == *-* ]]; then
            title="$TAG_NAME Windows beta"
            release_flags=(--prerelease)
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes" "${release_flags[@]}"
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --notes-file "$notes" "${release_flags[@]}"
          fi
          gh release upload "$TAG_NAME" \
            dist/windows/x86_64/ccb-windows-x86_64.zip \
            dist/windows/x86_64/ccb-windows-x86_64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
