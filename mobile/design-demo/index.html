<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCB Mobile · 交互设计提案</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#17252e;--muted:#62727b;--line:#e1e7ea;--brand:#225b83;--green:#177245;--greenbg:#e5f4eb;--red:#b33d43;--redbg:#ffedef;--orange:#ae5a05}*{box-sizing:border-box}body{margin:0;background:#e7ecef;color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent;min-height:44px;border-radius:10px;padding:8px 12px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #639dcb;outline-offset:2px}button:hover{filter:brightness(.95)}.studio{max-width:1150px;margin:32px auto;display:grid;grid-template-columns:260px minmax(320px,430px) 260px;gap:30px;align-items:start;padding:0 20px}.aside h1{font-size:27px;line-height:1.25;margin:10px 0}.aside p{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--brand);font-weight:800}.aside button{display:block;width:100%;text-align:left;margin:5px 0;background:#ffffff80}.aside button.on{background:var(--brand);color:white}.phone{background:var(--bg);border:1px solid #cad3d9;border-radius:30px;overflow:hidden;box-shadow:0 20px 70px #233d4f20;height:850px;max-height:94vh;display:flex;flex-direction:column;position:relative}.statusbar{padding:10px 22px 4px;display:flex;justify-content:space-between;font-size:12px;background:var(--surface)}.top{padding:14px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.title{font-size:24px;font-weight:750;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted)}.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;border-radius:7px;padding:3px 7px;white-space:nowrap}.working{color:var(--green);background:var(--greenbg)}.idle{color:var(--muted);background:#edf0f3}.error{color:var(--red);background:var(--redbg)}.unread{color:var(--orange);background:#fff1d9}.primary{background:var(--brand);color:white}.outline{border:1px solid var(--line);background:var(--surface)}.content{overflow:auto;flex:1;padding:16px 16px 24px}.search{width:100%;border:1px solid var(--line);background:var(--surface);padding:11px 12px;border-radius:10px;color:var(--ink)}.filters{display:flex;gap:5px;margin:10px 0 18px}.filters button{flex:1;font-size:13px;padding:6px}.filters .chosen{background:var(--ink);color:var(--surface)}.section{font-size:12px;color:var(--muted);margin:18px 0 8px;font-weight:650;letter-spacing:.5px}.project{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);padding:16px;width:100%;margin:10px 0;border-radius:14px}.project strong{font-size:17px}.project .desc{margin:11px 0;color:var(--muted);font-size:13px}.project .foot{display:flex;gap:8px;align-items:center;font-size:12px}.nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 12px}.nav button{flex:1;font-size:12px;color:var(--muted)}.nav button b{display:block;font-size:18px;line-height:1.25}.nav .active{color:var(--brand);background:#edf4fa}.list{border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden}.list>button{border-radius:0;border-bottom:1px solid var(--line);width:100%;text-align:left;padding:14px;display:flex;align-items:center;gap:10px}.list>button:last-child{border-bottom:0}.avatar{width:36px;height:36px;background:#eaf0f5;color:var(--brand);display:grid;place-items:center;border-radius:10px;font-weight:700;flex-shrink:0}.agentbar{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}.agentchip{border:1px solid #acd5bc;background:var(--greenbg);color:var(--green);font-size:13px}.agentchip.selected{outline:2px solid var(--brand);outline-offset:2px}.bubble{margin:14px 0;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.bubble.user{margin-left:32px;background:#eaf2f9;border:0}.bubble p{margin:7px 0}.meta{font-size:12px;color:var(--muted);margin-bottom:8px}.code{font:12px/1.6 monospace;background:var(--bg);padding:12px;border-radius:8px;white-space:pre-wrap}.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 14px}.composer textarea{width:100%;resize:none;border:0;background:var(--bg);border-radius:10px;padding:10px;color:var(--ink)}.composer .row{margin-top:5px}.notice{background:#fff5dc;color:#725209;padding:10px 16px;font-size:12px}.info{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0}.switch{background:var(--brand);color:#fff;font-size:12px;padding:3px 8px;border-radius:12px}.sheetback{position:absolute;inset:0;background:#14273365;z-index:5;display:flex;align-items:flex-end}.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-height:85%;overflow:auto;padding:18px}.sheet h2{font-size:20px;margin:0}.empty{padding:30px 10px;text-align:center;color:var(--muted)}.note{font-size:13px;background:#ffffff85;border-radius:12px;padding:15px;margin:12px 0}.note h3{font-size:14px;margin:0 0 8px}.note ul{padding-left:18px;margin:5px 0}.mode{display:flex;gap:5px}.mode button{flex:1;border:1px solid var(--line)}.toast{position:absolute;bottom:90px;left:20px;right:20px;background:var(--ink);color:var(--surface);border-radius:10px;padding:12px;z-index:8;font-size:13px}.dark{--bg:#141e27;--surface:#1c2935;--ink:#e4edf3;--muted:#a2b4c1;--line:#344451;--brand:#7bb5df;--green:#8bdbac;--greenbg:#203d30;--red:#ffabb0;--redbg:#492c34}.dark .primary{color:#14232e}.dark .idle{background:#30404d}.dark .bubble.user{background:#253d50}.dark .nav .active{background:#293f52}.dark .avatar{background:#293f52}.dark .agentchip{background:var(--greenbg)}.dark .search{color:var(--ink)}.dark .unread{background:#4c381d;color:#ffc777}details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:13px}.compact .project{padding:11px;margin:7px 0}.compact .desc{margin:5px 0}.compact .bubble{padding:10px 12px;margin:9px 0}@media(max-width:950px){.studio{grid-template-columns:220px minmax(320px,430px)}.review{grid-column:1/-1}}@media(max-width:620px){.studio{display:block;margin:0;padding:0}.aside,.review{padding:16px}.aside h1{font-size:22px}.aside .screens{display:flex;flex-wrap:wrap}.aside .screens button{width:auto;font-size:12px}.phone{width:100%;height:850px;max-height:90vh;border-radius:0;border:0;box-shadow:none}.aside p{margin:8px 0}.review{padding-bottom:40px}}
</style>
<div class="studio"><aside class="aside"><div class="eyebrow">CCB MOBILE / DESIGN LAB</div><h1>把远程工作<br>放进口袋</h1><p>交互原型 · 模拟数据<br>不连接服务器，不发送真实指令。</p><div class="screens" id="screens"></div><div class="note"><h3>对比显示密度</h3><div class="mode"><button onclick="density(false)">舒适</button><button onclick="density(true)">紧凑</button></div><button onclick="document.querySelector('.phone').classList.toggle('dark')">◐ 切换亮／暗主题</button><button onclick="offline=!offline;render()">⌁ 模拟断网／恢复</button></div><p class="sub">建议依次体验：筛选工作项目 → 切换 Agent → 查看未读 → 设置返回。也可直接在手机浏览器打开本文件。</p></aside><main class="phone"><div class="statusbar"><span>9:41</span><span>演示模式 · ▰</span></div><div id="app" style="display:contents"></div><div id="overlay"></div></main><aside class="review"><div class="eyebrow">SELF REVIEW</div><h2 style="font-size:20px">原型审查笔记</h2><div id="review"></div><div class="note"><h3>本轮边界</h3>这是设计提案，不代表已实现的产品。配对、附件上传、模型应用和终端执行只展示交互位置；通知数量与状态均为模拟。</div></aside></div>
<script>
const $=s=>document.querySelector(s);let page='home',filter='all',query='',agent='agent1',offline=false,unread=3,selectedProject='CCB Bridge';let stack=[];
const projects=[{name:'CCB Bridge',path:'yunwei / ccb-v2',desc:'移动端状态界面 · 最后活动 刚刚',work:2,unread:3},{name:'DeePoly',path:'research / deepoly',desc:'基准测试已完成 · 12 分钟前',work:0,unread:1},{name:'实验室基金',path:'workspace / 基金',desc:'上次打开 昨天',work:0,unread:0}];
const agents=[{name:'agent1',provider:'Codex',window:'main',state:'working',label:'工作中',task:'检查界面布局与测试结果',unread:1},{name:'demo',provider:'OMP',window:'main',state:'idle',label:'空闲',task:'状态配色方案已交付',unread:0},{name:'reviewer',provider:'Claude',window:'review',state:'working',label:'工作中',task:'审查消息发送逻辑',unread:2},{name:'agent3',provider:'OMP',window:'review',state:'error',label:'需处理',task:'服务额度不足，任务未完成',unread:0}];
const notes={home:['信息层级','名称、任务状态优先，路径退居辅助层。工作项目不再整块浓染。','筛选只改变当前列表，不自动重排；避免点击时项目跳动。','风险：项目多时“最近使用”仍需后续设计置顶操作。'],chat:['目标身份优先','顶部始终保留 Agent 全名及项目；把低频操作放到“更多”。','草稿明确写给谁。工作中发送用“排队发送”，原型不假定能打断所有 Provider。','风险：实际发送/排队能力必须由后端能力决定，不能仅靠前端文字承诺。'],agents:['可检索的全局切换','先按窗口分组，再显示状态与当前任务摘要。未读角标与工作状态并存。','常用 Agent 横排；大量 Agent 通过列表搜索，不要求反复横向滑动。','风险：任务摘要必须有可靠来源，缺失时应隐藏，不能用模型猜测。'],inbox:['把提醒变成下一步','按“需处理／完成”组织；每项带目标和时间，可跳到对应 Agent。','点开一条只处理该条未读，避免切项目就清空所有消息。','风险：后台推送、重复通知和定位权限仍需真实设备验证。'],settings:['已配对后的设置','连接管理优先，首次配对说明只在添加服务器时出现。','外观、终端和后台连接分组，避免装饰性设置占满首屏。','风险：背景保活必须说明耗电，不能暗示开启就绝不掉线。'],terminal:['显式进入控制模式','清楚标明主机和 Agent；快捷键与聊天输入分离。','危险或改变运行状态的操作不以图标暗示成功。演示键不执行指令。','风险：滚动、文本选择、键盘避让需要原生终端实测，网页原型无法证明。']};
function nav(p){stack.push(page);page=p;query='';render()}function back(){page=stack.pop()||'home';query='';render()}function density(c){$('.phone').classList.toggle('compact',c)}function badge(s,t){return `<span class="badge ${s}">${s==='working'?'● ':s==='error'?'! ':''}${t}</span>`}function head(title,sub,action=''){return `<header class="top"><div class="row between"><div class="grow"><div class="title">${title}</div><div class="sub">${sub}</div></div>${action}</div></header>`}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function footer(){return `<nav class="nav">${[['home','▦','项目'],['inbox','◉','收件箱'],['settings','⚙','设置']].map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="nav('${p}')"><b>${i}</b>${n}${p==='inbox'&&unread?' · '+unread:''}</button>`).join('')}</nav>`}function openProject(i){selectedProject=projects[i].name;agent=i===0?'agent1':'demo';nav('chat')}function openAgent(n){agent=n;closeSheet();nav('chat')}function search(v){query=v;const pos=$('#search')?.selectionStart;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos)}function toast(t){$('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;$('.phone').append(d);setTimeout(()=>d.remove(),2600)}
function render(){let html='',a=agents.find(a=>a.name===agent);$('#screens').innerHTML=[['home','01 项目首页'],['chat','02 Agent 会话'],['agents','03 全部 Agent'],['inbox','04 收件箱'],['settings','05 设置'],['terminal','06 终端']].map(([p,t])=>`<button class="${page===p?'on':''}" onclick="nav('${p}')">${t}</button>`).join('');const n=notes[page];$('#review').innerHTML=`<div class="note"><h3>${n[0]}</h3><p>${n[1]}</p><p>${n[2]}</p></div><div class="note"><h3>我认为还需要验证</h3>${n[3]}</div>`;
if(page==='home'){html=head('项目','工作站 · '+(offline?'离线，显示缓存':'已连接 · 刚刚同步'),`<button class="outline" onclick="sheet('connect')">＋ 连接</button>`)+`<div class="content"><input id="search" class="search" placeholder="搜索项目或路径" aria-label="搜索项目" value="${esc(query)}" oninput="search(this.value)"><div class="filters">${[['all','全部'],['working','工作中 1'],['unread','未读 2']].map(([k,t])=>`<button class="${filter===k?'chosen':''}" onclick="filter='${k}';render()">${t}</button>`).join('')}</div><div class="section">最近使用</div>${projects.map((p,i)=>p.name.toLowerCase().includes(query.toLowerCase())||p.path.includes(query)?{p,i}:null).filter(Boolean).filter(({p})=>filter==='all'||filter==='working'&&p.work||filter==='unread'&&p.unread).map(({p,i})=>`<button class="project" onclick="openProject(${i})"><div class="row between"><strong>${p.name}</strong><span style="color:var(--muted)">›</span></div><div class="sub">${p.path}</div><div class="desc">${p.desc}</div><div class="foot">${p.work?badge('working',p.work+' 工作中'):badge('idle','空闲')}${p.unread?badge('unread',p.unread+' 未读'):''}</div></button>`).join('')||'<div class="empty">没有符合条件的项目</div>'}<div class="info sub">只连接一台机器时保持单机视图。第二台上线后才展示主机分组。</div></div>`+footer()}
if(page==='chat'){html=head(`<div class="row"><button aria-label="返回" onclick="back()">‹</button><span>${agent}</span></div>`,`${selectedProject} / ${a.window} · ${a.provider}`,`<button onclick="sheet('more')">更多</button>`)+`<div class="agentbar"><div class="row between">${badge(a.state,a.label)}<button onclick="nav('agents')">全部 Agent · 4 ›</button></div><div class="sub">${offline?'状态为上次同步记录':a.task}</div></div><div class="content" id="timeline"><div class="bubble user"><div class="meta">你 · 09:32</div>检查手机端状态显示，重点关注未读和工作状态能否独立识别。</div><div class="bubble"><div class="meta">${agent} · 09:34</div><p>已完成第一轮检查，发现两个需要修正的地方：</p><p>1. 选中样式不能覆盖工作状态底色。<br>2. 明确空闲应优先于残留进度提示。</p><details><summary>查看检查过程 · 3 个步骤</summary><div class="code">✓ 读取状态映射\n✓ 检查选中态背景\n✓ 添加回归断言</div></details></div><div class="bubble"><div class="meta">${agent} · 刚刚</div>${a.state==='working'?'正在验证窄屏与长名称布局。':a.state==='error'?'服务额度不足。本次任务没有完成；请检查服务状态后再重试。':'本轮工作已完成，可以继续发送任务。'}<div class="row" style="margin-top:8px"><button class="outline" onclick="toast('已模拟复制摘要')">复制摘要</button><button onclick="sheet('original')">查看原文</button></div></div></div><div class="composer"><div class="sub">发送给 <strong>${agent}</strong> · ${selectedProject}</div><textarea rows="2" id="draft" aria-label="消息草稿" placeholder="输入任务或补充说明…"></textarea><div class="row between"><button onclick="toast('附件入口演示：实际上传未接入')">＋ 附件</button><button class="primary" ${offline?'disabled':''} onclick="sendDemo()">${offline?'离线 · 暂不可发送':a.state==='working'?'排队发送':'发送'}</button></div></div>`}
if(page==='agents'){html=head('选择 Agent',selectedProject,`<button onclick="back()">返回</button>`)+`<div class="content"><input id="search" class="search" placeholder="搜索 Agent 或 Provider" aria-label="搜索 Agent" value="${esc(query)}" oninput="search(this.value)">${['main','review'].map(w=>`<div class="section">${w} · ${agents.filter(a=>a.window===w&&a.state==='working').length} 工作中</div><div class="list">${agents.filter(a=>a.window===w&&(a.name+a.provider).toLowerCase().includes(query.toLowerCase())).map(a=>`<button onclick="openAgent('${a.name}')"><div class="avatar">${a.name===agent?'✓':a.provider[0]}</div><div class="grow"><div class="row between"><strong>${a.name}</strong>${badge(a.state,a.label)}</div><div class="sub">${a.provider} · ${a.task}</div>${a.unread?badge('unread',a.unread+' 未读'):''}</div></button>`).join('')}</div>`).join('')}</div>`}
if(page==='inbox'){html=head('收件箱',`${unread} 条未读 · 来自已配对的主机`)+`<div class="content"><div class="section">需要处理</div><button class="project" onclick="agent='agent3';unread=Math.max(0,unread-1);nav('chat')"><div class="row between"><strong>任务未完成</strong>${badge('error','额度不足')}</div><div class="desc">CCB Bridge / agent3<br>服务暂不可用，等待你处理。</div><div class="sub">2 分钟前 · 点击查看上下文</div></button><div class="section">工作更新</div><button class="project" onclick="agent='demo';unread=Math.max(0,unread-1);nav('chat')"><strong>界面方案已完成</strong><div class="desc">CCB Bridge / demo<br>状态颜色和窄屏布局已交付。</div><div class="sub">8 分钟前 · 查看结果</div></button><button class="project" onclick="selectedProject='DeePoly';agent='demo';unread=Math.max(0,unread-1);nav('chat')"><strong>基准测试结束</strong><div class="desc">DeePoly / demo<br>结果已生成，等待审查。</div><div class="sub">12 分钟前 · 查看结果</div></button></div>`+footer()}
if(page==='settings'){html=head('设置','按需配置，连接保持独立')+`<div class="content"><div class="section">连接</div><div class="list"><button onclick="sheet('connection')"><span class="avatar">⌁</span><span class="grow"><strong>工作站</strong><div class="sub">${offline?'离线 · 可查看缓存':'已连接 · 私有连接'}</div></span>›</button><button onclick="sheet('connect')"><span class="grow">添加服务器</span>＋</button></div><div class="section">显示与输入</div><div class="list"><button onclick="document.querySelector('.phone').classList.toggle('dark')"><span class="grow">外观<div class="sub">点击切换亮色／暗色预览</div></span>◐</button><button onclick="density(!document.querySelector('.phone').classList.contains('compact'))"><span class="grow">显示密度<div class="sub">舒适 / 紧凑</div></span>↕</button><button onclick="sheet('terminal')"><span class="grow">终端偏好<div class="sub">字号与常用快捷键</div></span>›</button></div><div class="section">通知与连接可靠性</div><div class="list"><button onclick="toast('原型：仅重要通知 / 全部通知 / 静音')"><span class="grow">通知范围<div class="sub">完成、失败、等待处理</div></span>›</button><button onclick="sheet('background')"><span class="grow">后台保持连接<div class="sub">可能增加耗电，查看说明后开启</div></span>关闭</button></div><div class="section">支持</div><div class="list"><button onclick="sheet('diagnostics')"><span class="grow">连接诊断</span>›</button><button onclick="toast('设计原型 · 非发布版本')"><span class="grow">关于 CCB Mobile</span>›</button></div></div>`+footer()}
if(page==='terminal'){html=head('终端',`工作站 / ${selectedProject} / ${agent}`,`<button onclick="back()">返回聊天</button>`)+`<div class="notice">交互示意 · 未建立终端连接，不执行任何按键</div><div class="content" style="background:#14212b;color:#bce8ca;font-family:monospace"><p>$ ccb status</p><p>agent1  working<br>demo    idle<br>reviewer working</p><p style="color:#94a9b9">当前为只读演示输出。</p><p>▍</p></div><div class="composer"><div class="row" style="flex-wrap:wrap">${['Esc','Tab','Ctrl-C','↑','↓','更多键'].map(k=>`<button class="outline" onclick="toast('演示按键：${k}，未发送')">${k}</button>`).join('')}</div><div class="sub">输入目标始终可见，终端控制与消息发送分离</div></div>`}
$('#app').innerHTML=(offline?'<div class="notice">连接已断开 · 显示缓存 · 状态可能已过期</div>':'')+html;
}
function sendDemo(){const d=$('#draft');if(!d.value.trim()){toast('请先输入任务');return}const t=document.createElement('div');t.className='bubble user';t.textContent=d.value;$('#timeline').append(t);d.value='';t.scrollIntoView({block:'nearest'});toast('仅加入原型界面，未发送到服务器')}
function closeSheet(){$('#overlay').innerHTML=''}function sheet(kind){let title='',body='';const button=(s,act)=>`<button class="outline" style="width:100%;margin:5px 0;text-align:left" onclick="${act}">${s}</button>`;if(kind==='more'){title='会话操作';body=button('打开终端',"closeSheet();nav('terminal')")+button('模型与思考设置',"sheet('model')")+button('刷新当前会话',"closeSheet();toast('原型：已模拟刷新')")+button('查看连接诊断',"sheet('diagnostics')")}if(kind==='connect'){title='添加服务器';body='<p>在电脑运行 <code>ccb update mobile</code>，然后扫描连接码。</p>'+button('扫描二维码',"toast('扫码仅演示，未请求相机权限')")+button('粘贴连接码',"toast('原型不读取剪贴板或凭据')")}if(kind==='connection'){title='工作站';body='<p>连接状态：'+(offline?'离线':'已连接')+'</p><p class="sub">常规页面展示主机身份；技术路由与详细错误放进诊断。</p>'+button('连接诊断',"sheet('diagnostics')")}if(kind==='model'){title='模型与思考';body='<div class="info">当前：Codex · GPT-5.6<br>思考：高</div><p>变更仅影响 CCB 本地设置。需要重启时先说明影响，不能误报即时生效。</p>'+button('预览变更确认',"toast('示意：保存为待应用，不修改真实 Provider')")}if(kind==='background'){title='后台保持连接';body='<p>适合需要持续接收任务进度的场景。可能增加耗电，系统仍可能限制后台运行。</p>'+button('了解后开启（演示）',"closeSheet();toast('仅演示，未修改后台设置')")}if(kind==='terminal'){title='终端偏好';body='<p>字号：13 pt<br>常用键：Esc / Tab / Ctrl-C / 方向键</p><p class="sub">自定义更多键应进入二级页面，不把全部按键挤在输出区。</p>'}if(kind==='diagnostics'){title='连接诊断';body='<div class="info">主机可达：模拟正常<br>事件连接：'+(offline?'已断开':'正常')+'<br>最后同步：09:41</div><p>诊断信息应支持脱敏复制，不默认展示或复制配对密钥。</p>'+button('复制脱敏摘要（演示）',"toast('原型未读取真实诊断数据')")}if(kind==='original'){title='原始消息';body='<div class="code">[模拟原文]\n检查选中状态与 activity fill 的优先级。\n新增断言：selected background == activity background。</div>'}$('#overlay').innerHTML=`<div class="sheetback" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="row between"><h2>${title}</h2><button onclick="closeSheet()" aria-label="关闭">✕</button></div>${body}</section></div>`;$('#overlay button')?.focus()}
// Keep the review prototype internally consistent: drafts belong to a target,
// and opening a notification acknowledges it once, not every revisit.
const drafts=new Map(),readNotifications=new Set();
projects[0].unread=2;agents[2].unread=1;
const baseRender=render;
render=function(){baseRender();if(page==='chat'){
  const target=selectedProject+' / '+agent;
  $('#draft').value=drafts.get(target)||'';
  $('#draft').addEventListener('input',e=>drafts.set(target,e.target.value));
}if(page==='inbox'){
  const targets=[['CCB Bridge','agent3'],['CCB Bridge','demo'],['DeePoly','demo']];
  document.querySelectorAll('#app .project').forEach((b,i)=>{
    b.onclick=()=>{if(!readNotifications.has(i)){readNotifications.add(i);unread--;projects[i===2?1:0].unread--;}
      selectedProject=targets[i][0];agent=targets[i][1];nav('chat');};
    if(readNotifications.has(i)){b.insertAdjacentHTML('beforeend','<div class="sub">已读</div>');}
  });
}};
const baseSend=sendDemo;sendDemo=function(){baseSend();drafts.set(selectedProject+' / '+agent,$('#draft').value)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
